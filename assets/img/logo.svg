<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Joyboy">
  <defs>
    <radialGradient id="core" cx="45%" cy="40%" r="65%">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset=".45" stop-color="#ffc857"/>
      <stop offset="1" stop-color="#ff7a45"/>
    </radialGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd56b"/>
      <stop offset="1" stop-color="#ff7a45"/>
    </linearGradient>
  </defs>
  <!-- 12 flame-shaped rays -->
  <g fill="url(#ray)">
    <g id="r"><path d="M60 4 C66 14 68 20 60 30 C52 20 54 14 60 4Z"/></g>
    <use href="#r" transform="rotate(30 60 60)"/>
    <use href="#r" transform="rotate(60 60 60)"/>
    <use href="#r" transform="rotate(90 60 60)"/>
    <use href="#r" transform="rotate(120 60 60)"/>
    <use href="#r" transform="rotate(150 60 60)"/>
    <use href="#r" transform="rotate(180 60 60)"/>
    <use href="#r" transform="rotate(210 60 60)"/>
    <use href="#r" transform="rotate(240 60 60)"/>
    <use href="#r" transform="rotate(270 60 60)"/>
    <use href="#r" transform="rotate(300 60 60)"/>
    <use href="#r" transform="rotate(330 60 60)"/>
  </g>
  <circle cx="60" cy="60" r="29" fill="url(#core)"/>
  <circle cx="60" cy="60" r="29" fill="none" stroke="#fff6d8" stroke-opacity=".55" stroke-width="1.5"/>
  <!-- J monogram -->
  <path d="M66 44 v20 a10 10 0 0 1 -20 0" fill="none" stroke="#2a1606" stroke-width="7" stroke-linecap="round"/>
  <circle cx="66" cy="44" r="3.5" fill="#2a1606"/>
</svg>
